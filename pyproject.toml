[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-marble"
version = "0.1.0"
description = "Prompt-to-world 3D voxel engine: type words, walk through the world. Tiny Marble."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "OpenSourceRulesz"}]
dependencies = ["numpy"]
keywords = ["world-model", "voxel", "3d", "generative", "marble"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
fast = ["taichi"]  # 256x256 at 60-100 FPS (vs 64x64 numpy fallback)
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/OpenSourceRulesz/tiny-marble"

[tool.setuptools.packages.find]
include = ["tiny_marble*"]
